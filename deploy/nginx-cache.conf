# Configuration nginx à coller dans Coolify (application arxWeb →
# Configuration → "Custom Nginx Configuration"), ou à monter dans
# /etc/nginx/conf.d/ si le build pack passe en Dockerfile.
#
# Constat mesuré le 2026-08-06 : aucun en-tête Cache-Control n'est émis sur
# /assets → chaque visite revalide toutes les images (ETag). Et les fichiers
# _redirects (Netlify) / vercel.json (Vercel) ne sont pas lus par nginx :
# /nice, /nice.html et /Nice/ renvoyaient tous 200 (duplicate content SEO).

# --- Assets versionnés : cache long ---
location ~* \.(webp|avif|png|jpe?g|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# --- HTML : toujours revalidé (déploiement continu) ---
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}

# --- Redirections 301 (remplacent _redirects et vercel.json, inopérants) ---
location = /nice      { return 301 /Nice/; }
location = /nice.html { return 301 /Nice/; }
location = /Nice.html { return 301 /Nice/; }
location = /nissai    { return 301 /nissai/; }

# --- Compression (gzip déjà actif ; ces valeurs couvrent les types manquants) ---
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml text/xml;
gzip_min_length 1024;
