# --- Open WebUI Mobile App Reverse Proxy (Prefix ^~ prevents regex match override) ---
resolver 127.0.0.11 valid=30s;
set $webui_upstream http://open-webui:8080;

location ^~ /_app/ {
    proxy_pass $webui_upstream/_app/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /static/ {
    proxy_pass $webui_upstream/static/;
    proxy_set_header Host $host;
}

location ^~ /chat/ {
    proxy_pass $webui_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location = /chat {
    return 301 /chat/;
}

# --- Assets versionnés : cache long ---
location ~* \.(webp|avif|png|jpe?g|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# --- HTML : toujours revalidé (déploiement continu) ---
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}

# --- Redirections 301 (remplacent _redirects et vercel.json, inopérants) ---
location = /nice        { return 301 /Nice/; }
location = /nice.html   { return 301 /Nice/; }
location = /Nice.html   { return 301 /Nice/; }
location = /nissai      { return 301 /nissai/; }
location = /AITraining  { return 301 /AITraining/; }
location = /aitraining  { return 301 /AITraining/; }

# --- Open WebUI Mobile App Reverse Proxy ---
